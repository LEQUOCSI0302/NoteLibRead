<!DOCTYPE html>
<html lang="en-vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập
    </title>
    <!-- Đưa các css có liên qua đến header và footer ra home để nó chạy nguyên trang -->
    <link rel="stylesheet" th:href="@{/css/login.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>


<!-- Giao diện đăng nhập -->
<div class = "login-page-wrapper">
    <!-- header -->
    <div th:replace="layout/header :: header"></div>

    <!-- chính -->
    <div class ="login-container">
        <div class ="login-card">

            <!-- Bên trái : phần đăng nhập -->
            <div class ="login-left">
                <h2>Đăng nhập bằng tên tài khoản</h2>

                <!-- Thông báo đăng nhập sai -->
                <div th:if = "${param.error}" class="alert alert-danger">
                    <i class="fa-solid fa-circle-exclamation"></i> Sai tên đăng nhập hoặc mật khẩu!
                </div>

                <!-- form đăng nhập chính -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Tên đăng nhập hoặc email</label>
                    <input id="username"  type="text" name="username" placeholder="Nhập tên đăng nhập hoặc email" required/>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input id="password" type="password" name="password" placeholder="Nhập mật khẩu" required/>
                </div>

                <!-- Ghi nhớ tài khoản mật khẩu -->
                <div class = "remember-row">
                    <label>
                        <input type="checkbox" name="remember-me" /> Ghi nhớ tôi
                    </label>
                    <a href="#"> Giúp với, tôi không thể đăng nhập</a>
                </div>
                <button type="submit" class="btn-login">Đăng nhập</button>
            </form>
            <div class="oauth-separator">
                Hoặc đăng nhập bằng
            </div>
            <!-- Đăng nhập bằng Google -->
            <form th:action="@{/oauth2/authorization/google}" method="get">
                <button type="submit" class ="btn-oauth">
                <i class="fa-solid fa-envelope" style="color: rgb(255, 255, 255);"></i>
                Đăng nhập với Gmail
                </button>
            </form>
             <p class="register-link">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
            </div>

            <!-- Cột phẢI: qr PLACEHOLDER -->
            <div class = "image-login-anime">
                <img th:src="@{/images/tiara_login_image.png}" alt="Tiara">
            </div>
        </div>
    </div>
    <!-- footer -->
    <div th:insert="layout/footer :: footer"></div>
    </div>
</body>
</html>
