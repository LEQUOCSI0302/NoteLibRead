<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>Header</title>

</head>
<header>
    <div class="header-top">
    <!-- Logo -->
        <div class="logo-buffalo">
            <a th:href="@{/}">
                <img th:src="@{/images/logo.png}"  alt="Logo">
            </a>
        </div>

    <!-- Thanh chuyển hướng đề mục -->
        <nav class="nav_menu">
            <ul>
                <li><a th:href="@{/}">Trang chủ</a></li>
                <li><a th:href="@{/top-works}">Top Tác Phẩm</a></li>
                <li><a th:href="@{/top-authors}">Top Tác Giả</a></li>
                <li><a th:href="@{/discussions}">Thảo luận</a></li>

                <li class="genre-dropdown">
                  <a href="#" class="genre-dropdown-toggle">Thể loại</a>
                    <ul class="genre-dropdown-menu" id = "genreMenu">
                        <li th:each="genre : ${genres}">
                            <a th:href="@{/genres/{slug}(slug=${genre.slug})}" th:text="${genre.name}">Genre</a>
                        </li>
                    </ul>
                </li>

                <li><a th:href="@{/contribute}">Cống hiến</a></li>
                <!-- Nếu chưa đăng nhập --->
                <li th:if ="${currentUser == null}">
                    <a th:href="@{/login}">Đăng nhập</a></li>
                <!-- Nếu đã đăng nhập -->
                <li th:if ="${currentUser != null}" class = "user-dropdown">
                    <a th:href="#" class = "user-toogle">
                        <img th:src="currentUser.avatarUrl != null ? currentUser.avatarUrl : @{/images/default-avatar.png}" alt="Avatar"
                             style="width: 32px; height: 32px; border-radius: 50%; vertical-align: middle;">
                        <span th:text ="${currentUser.username}">
                            Tên
                        </span></a>
                    <ul class="user-menu">
                        <li><a th:href="@{/profile}">Hồ sơ</a></li>
                        <li><a th:href="@{/settings}">Cài đặt</a></li>
                        <li><a th:href="@{/logout}">Đăng xuất</a></li>

                    </ul>
                </li>
            </ul>
        </nav>
    </div>



    <!-- Header tìm kiếm duới -->
    <div class="header-bottom">
        <div class ="search-box">
            <input type="text" placeholder="Tìm kiếm..."/>
            <button>
                <i class="fa-solid fa-magnifying-glass" style="color: rgb(255, 255, 255);"></i>
            </button>
        </div>
        <div class="header-utils">
            <button class="btn-darkmode" onclick ="toggleDarkMode()" type="button" id="darkModeBtn">🌙</button>

            <!-- Phần language có thêm danh sách để người khác lựa chọn -->
            <div class = "lang-dropdown">
                <button class = "lang-toggle" onclick = "toggleLang()" type="button">🌐</button>
                <ul class = "lang-menu" id = "langMenu">
                    <!-- Tiếng việt -->
                    <li>
                        <a th:href="@{''(lang=vi)}">
                            <span class="lang-icon">🇻🇳</span>
                            <span>Tiếng Việt</span>
                        </a>
                    </li>
                    <!-- Tiếng anh -->
                    <li>
                        <a th:href="@{''(lang=en)}">
                            <span class="lang-icon">🇺🇸</span>
                            <span>English</span>
                        </a>
                    </li>
                    <!-- Tiếng nhật -->
                    <li>
                        <a th:href="@{''(lang=ja)}">
                            <span class="lang-icon">🇯🇵</span>
                            <span>日本語</span>
                        </a>
                    </li>
                </ul>

            </div>
        </div>

    </div>
    <script th:src="@{/js/header.js}"></script>
</header>
</html>
